# This workflow is used to build releases
# It can also be called by other workflows to reuse the release flow.
name: Release

on:
  # If you push to main this will trigger a stable release
  push:
    branches:
      - master
      - main

  # Reusable workflow : Usually called by a `snapshot` workflow
  workflow_call:
    inputs:
      snapshot:
        description: "Is this a snapshot build?"
        required: false
        default: false
        type: boolean

  # Manual dispatch
  workflow_dispatch:
    inputs:
      deploy_gcf:
        description: "Deploy to Google Cloud Functions after build"
        required: false
        default: false
        type: boolean
      gcf_function_name:
        description: "Function name to deploy (required when deploy_gcf=true)"
        required: false
        type: string
      gcp_region:
        description: "Google Cloud region"
        required: false
        default: "us-central1"
        type: string

env:
  SNAPSHOT: ${{ inputs.snapshot || false }}
  DEPLOY_GCF: ${{ github.event.inputs.deploy_gcf || false }}
  GCF_FUNCTION_NAME: ${{ github.event.inputs.gcf_function_name || '' }}
  GCP_REGION: ${{ github.event.inputs.gcp_region || 'us-central1' }}
  JDK_VERSION: 21
  BUILD_ID: ${{ github.run_number }}

jobs:
  #############################################
  # Build Snapshot or Final Release
  #############################################
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JDK_VERSION }}

      - name: Setup Environment Variables For Build Process
        id: current_version
        run: |
          # Read name and version of the project
          PROJECT_NAME=$(grep '^rootProject.name=' settings.gradle | cut -d'=' -f2 | tr -d "'\"")
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT

          TMPVERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          echo "VERSION=$TMPVERSION" >> $GITHUB_ENV
          echo "version=$TMPVERSION" >> $GITHUB_OUTPUT

          # Branch Detection
          echo "Github Ref is $GITHUB_REF"
          echo "BRANCH=main" >> $GITHUB_ENV

          # Snapshot Detection
          if [ $GITHUB_REF == 'refs/heads/development' ]
          then
            echo "BRANCH=development" >> $GITHUB_ENV
          fi

      - name: Update changelog [unreleased] with latest version
        uses: thomaseizinger/keep-a-changelog-new-release@3.1.0
        if: env.SNAPSHOT == 'false'
        with:
          changelogPath: ./changelog.md
          tag: v${{ steps.current_version.outputs.version }}

      - name: Build v${{ steps.current_version.outputs.version }}
        run: |
          npm install -g markdownlint-cli
          markdownlint changelog.md --fix
          box install --production
          ./gradlew clean shadowJar buildLambdaZip -x test --stacktrace --console=plain

      - name: Commit Changelog [unreleased] with latest version
        uses: EndBug/add-and-commit@v9.1.4
        if: env.SNAPSHOT == 'false'
        with:
          author_name: Github Actions
          author_email: info@ortussolutions.com
          message: "Finalized changelog for v${{ steps.current_version.outputs.version }}"
          add: changelog.md

      - name: Tag Version
        uses: rickstaa/action-create-tag@v1.7.2
        if: env.SNAPSHOT == 'false'
        with:
          tag: "v${{ steps.current_version.outputs.version }}"
          force_push_tag: true
          message: "Latest Release v${{ steps.current_version.outputs.version }}"

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boxlang-build
          path: |
            build/distributions/*.zip
            build/distributions/*.jar
            build/reports/tests/**
            changelog.md

      - name: Authenticate to Google Cloud
        if: env.DEPLOY_GCF == 'true' && env.SNAPSHOT == 'false'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud SDK
        if: env.DEPLOY_GCF == 'true' && env.SNAPSHOT == 'false'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Google Cloud Functions
        if: env.DEPLOY_GCF == 'true' && env.SNAPSHOT == 'false'
        shell: bash
        run: |
          if [ -z "${GCF_FUNCTION_NAME}" ]; then
            echo "gcf_function_name is required when deploy_gcf=true"
            exit 1
          fi

          gcloud functions deploy "${GCF_FUNCTION_NAME}" \
            --gen2 \
            --runtime=java21 \
            --region="${GCP_REGION}" \
            --entry-point=ortus.boxlang.runtime.gcp.FunctionRunner \
            --trigger-http \
            --allow-unauthenticated \
            --source="build/distributions/${PROJECT_NAME}-${VERSION}.zip"

