plugins {
    id 'java'
	// For source code formatting
	id "com.diffplug.spotless" version "8.4.0"
    // Download task
    id "de.undercouch.download" version "5.6.0"
	// Shadow
	id "com.gradleup.shadow" version "9.0.2"
}

/**
 * Project Properties
 */
ext {
	buildID = System.getenv( 'BUILD_ID' ) ?: '0'
	branch = System.getenv( 'BRANCH' ) ?: 'development'
}

if ( branch == 'development' ) {
    // If the branch is 'development', ensure the version ends with '-snapshot'
    // This replaces any existing prerelease identifier with '-snapshot'
    version = version.contains('-') ? version.replaceAll(/-.*/, '-snapshot') : "${version}-snapshot"
}

repositories {
    mavenLocal()
    mavenCentral()
}

/**
 * Separate configuration for the GCF Java Function Invoker used only during
 * local development. Keeping it isolated means the invoker JAR is never
 * mixed into the compile, test, or shadow-JAR classpaths.
 */
configurations {
    invoker
}

dependencies {
	// Includes BoxLang + SLF4J + GCF
	implementation 'io.boxlang:boxlang-google-functions:' + boxlangVersion

    // Use only one SLF4J implementation to avoid warnings
	testImplementation( 'org.slf4j:slf4j-nop:2.0.17' ) {
		// Exclude to avoid conflicts with BoxLang's SLF4J binding
		exclude group: 'org.slf4j', module: 'slf4j-api'
	}
	// GCF Java Function Invoker — local dev server only, not on any compile/test/runtime path
	invoker 'com.google.cloud.functions.invoker:java-function-invoker:2.0.0'

	// GCF API — needed for MockHttpRequest/MockHttpResponse to compile against the interfaces
	testImplementation 'com.google.cloud.functions:functions-framework-api:2.0.0'
	// Jackson for JSON parsing in local testing
	testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.+'

	// Testing Frameworks
    testImplementation "org.junit.jupiter:junit-jupiter:6.+"
	testImplementation "org.mockito:mockito-core:5.+"
	testImplementation "com.google.truth:truth:1.+"
	// Explicitly declare the JUnit platform launcher (to avoid deprecation)
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

java {
	sourceCompatibility = JavaVersion.toVersion( jdkVersion )
	targetCompatibility = JavaVersion.toVersion( jdkVersion )
}

compileJava {
	// Compiler Options
	options.incremental = true
	options.encoding = 'UTF-8'
	options.debug = true
}

compileTestJava {
}

test {
    useJUnitPlatform()
    testLogging {
		showStandardStreams = true
	}
}

jar {
    archiveVersion =  "${version}"
 	manifest {
	   attributes 'Description': 'My BoxLang Google Cloud Function Runtime'
    }
}
shadowJar {
	mergeServiceFiles()
    destinationDirectory = file( "build/distributions" )
}

/**
 * Build the Lambda zip file for deployment
 */
task buildLambdaZip( type: Zip ) {
	archiveFileName = "${project.name}-${version}.zip"

	// Add Lambda.bx to the root of the ZIP
	from( 'src/main/bx' ) {
		into ''
	}

	// Add boxlang.json to the root of the ZIP
    from( 'src/resources/boxlang.json' ) {
        into '' // Ensure it's placed in the root
    }

	// Add BoxLang Modules
    from( 'src/resources/boxlang_modules/' ) {
        into 'boxlang_modules/'
    }

	// Include dependencies inside the `lib/` folder
	into( 'lib' ) {
		// All the Jars in the src/test/resources/libs directory
		from 'src/test/resources/libs'
		from shadowJar.outputs.files
	}
}
shadowJar.finalizedBy( buildLambdaZip )

/**
 * Run the Google Cloud Function locally using the official GCF Java Function
 * Invoker. The invoker starts an HTTP server on the configured port and routes
 * every request through FunctionRunner.
 *
 * Usage:
 *   ./gradlew runFunction                    # use defaults from gradle.properties
 *   ./gradlew runFunction -PtestPort=9090    # custom port
 *   ./gradlew runFunction -PdebugMode=true   # enable BoxLang verbose logging
 *   ./gradlew runFunction -PfunctionRoot=... # custom .bx root directory
 */
task runFunction( type: JavaExec, dependsOn: shadowJar ) {
    group = "application"
    description = "Run FunctionRunner locally via the GCF Java Function Invoker"

    // Only the invoker JAR goes on the JVM classpath; the shadow JAR is
    // passed to the invoker via --classpath so it is loaded in a child
    // classloader (matching the actual GCF deployment model).
    classpath = configurations.invoker
    mainClass  = "com.google.cloud.functions.invoker.runner.Invoker"

    // Default to src/main/bx where the .bx handlers live.
    // Override with -PfunctionRoot=<path> to point at a different directory.
    def bxRoot = ( project.findProperty( 'functionRoot' ) ?: file( 'src/main/bx' ).absolutePath ).toString()

    environment 'BOXLANG_GCP_ROOT',      bxRoot
    environment 'BOXLANG_GCP_DEBUGMODE', ( project.findProperty( 'debugMode' ) ?: 'false' ).toString()

    // Resolve the shadow JAR path inside doFirst so it runs after shadowJar
    // has finished writing its output.
    doFirst {
        args '--classpath', shadowJar.outputs.files.asPath,
             '--target',    'ortus.boxlang.runtime.gcp.FunctionRunner',
             '--port',      ( project.findProperty( 'testPort' ) ?: '9099' ).toString()

        println ""
        println "================================================================"
        println " BoxLang GCF Function Invoker"
        println " Listening on  : http://localhost:${project.findProperty( 'testPort' ) ?: '9099'}"
        println " Function root : ${bxRoot}"
        println " Debug mode    : ${project.findProperty( 'debugMode' ) ?: 'false'}"
        println " Press Ctrl+C to stop."
        println "================================================================"
        println ""
    }
}

/**
 * Download the BoxLang Google Functions runtime JAR from the Ortus S3 bucket.
 */
task downloadBoxLang( type: Download ) {
	dependsOn( 'processTestResources' )
	// Create the destination directory
	doFirst {
		file( "src/resources/libs" ).mkdirs()
	}

    // Configure the URL of the file to download
	src "https://s3.amazonaws.com/downloads.ortussolutions.com/ortussolutions/boxlang-runtimes/boxlang-google-functions/${boxlangVersion}/boxlang-google-functions-${boxlangVersion}.jar"

	// Specify the destination directory for the downloaded file
    dest "src/resources/libs/boxlang-google-functions-${boxlangVersion}.jar"
    overwrite true
    onlyIfModified false
}

/**
 * Project Wide Helper function
 * This is not a task, but a reusable UDF
 */
project.ext.bumpVersion = { boolean major = false, boolean minor = false, boolean patch = false ->

	def propertiesFile = file( './gradle.properties' );
	def properties = new Properties();

	properties.load( propertiesFile.newDataInputStream() )
	def versionTarget = major ? 0 : minor ? 1 : 2

	def currentVersion = properties.getProperty( 'version' )
	def versionParts = currentVersion.split( '\\.' )
	def newPathVersion = versionParts[ versionTarget ].toInteger() + 1
	def newVersion = '';

	if( patch ){
		newVersion = "${versionParts[ 0 ]}.${versionParts[ 1 ]}.${newPathVersion}"
	} else if( minor ){
		newVersion = "${versionParts[ 0 ]}.${newPathVersion}.0"
	} else if( major ){
		newVersion = "${newPathVersion}.0.0"
	}

	properties.setProperty( 'version', newVersion )
	properties.store( propertiesFile.newWriter(), null )

	println "Bumped version from ${currentVersion} to ${newVersion}"
}
/**
 * Bump the major version number
 */
task bumpMajorVersion {
	doLast{
		bumpVersion( true )
	}
}

/**
 * Bump the minor version number
 */
task bumpMinorVersion {
	doLast{
		bumpVersion( false, true )
	}
}

/**
 * Bump the patch version number
 */
task bumpPatchVersion {
	doLast{
		bumpVersion( false, false, true )
	}
}
